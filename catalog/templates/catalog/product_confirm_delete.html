{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card border-danger shadow">
            <div class="card-body">
                <h2 class="text-danger">Подтверждение удаления</h2>
                <p class="lead">Вы действительно хотите удалить товар <strong>"{{ object.name }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg px-5">Да, удалить</button>
                    <a href="{% url 'catalog:index' %}" class="btn btn-secondary btn-lg px-5">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
