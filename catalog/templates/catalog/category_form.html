{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3>{% if object %}Редактировать категорию{% else %}Новая категория{% endif %}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
