{% extends 'catalog/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Все категории</h1>
    <a href="{% url 'catalog:category_create' %}" class="btn btn-success">+ Создать категорию</a>
</div>
<div class="list-group">
    {% for category in categories %}
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-1">{{ category.name }}</h5>
            <small>{{ category.description }}</small>
        </div>
        <div class="btn-group">
            <a href="{% url 'catalog:category_update' category.pk %}" class="btn btn-sm btn-outline-secondary">Изменить</a>
            <a href="{% url 'catalog:category_delete' category.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
